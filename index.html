<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Scanner Presensi Guru</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.app {
  max-width: 500px;
  margin: auto;
  background: white;
  min-height: 100vh;
}

.header {
  background: #166534;
  color: white;
  text-align: center;
  padding: 22px;
}

.header h1 {
  margin: 0;
}

.header p {
  margin: 7px 0 0;
}

.content {
  padding: 20px;
  text-align: center;
}

video {
  width: 100%;
  max-width: 420px;
  border-radius: 15px;
  background: black;
}

canvas {
  display: none;
}

#status {
  margin: 15px 0;
  padding: 15px;
  border-radius: 10px;
  background: #f1f5f9;
}

#hasil {
  display: none;
  padding: 20px;
  border-radius: 15px;
  background: #f0fdf4;
  border: 2px solid #22c55e;
}

.idguru {
  font-size: 28px;
  font-weight: bold;
  margin: 15px;
}

button {
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  background: #166534;
  color: white;
  font-size: 16px;
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <h1>Presensi Guru</h1>

    <p>SMK Karya Bangsa Nusantara</p>

  </div>

  <div class="content">

    <div id="status">
      Meminta akses kamera...
    </div>

    <video id="video"
           autoplay
           playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="hasil">

      <h2>QR TERBACA</h2>

      <div class="idguru"
           id="idGuru"></div>

    </div>

    <br>

    <button onclick="mulaiKamera()">
      📷 Buka Kamera
    </button>

  </div>

</div>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

let stream = null;

let scanning = false;


/* =========================
   MULAI KAMERA
========================= */

async function mulaiKamera() {

  try {

    if (stream) {

      stream.getTracks().forEach(
        track => track.stop()
      );

    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;

    scanning = true;

    status.innerText =
      "Kamera aktif. Arahkan ke QR Code guru.";

    scanQR();

  }

  catch (error) {

    status.innerHTML =
      "❌ Kamera tidak dapat dibuka.<br><br>" +
      error.name +
      "<br>" +
      error.message;

  }

}


/* =========================
   SCAN QR
========================= */

function scanQR() {

  if (!scanning) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height
      );


    if (code) {

      scanning = false;

      document.getElementById("idGuru")
        .innerText = code.data;

      document.getElementById("hasil")
        .style.display = "block";

      status.innerText =
        "✅ QR berhasil dibaca";

      if (stream) {

        stream.getTracks().forEach(
          track => track.stop()
        );

      }

      return;

    }

  }

  requestAnimationFrame(scanQR);

}


/* =========================
   OTOMATIS MULAI
========================= */

mulaiKamera();

</script>

</body>

</html>
