<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presensi Guru</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7f4;
  color: #1f2937;
}

/* =========================================
   HEADER
========================================= */

.header {
  background: linear-gradient(135deg, #087f5b, #16a085);
  color: white;
  padding: 22px 15px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 6px 0 0;
  font-size: 14px;
  opacity: 0.95;
}


/* =========================================
   MENU UTAMA
========================================= */

.menu {
  display: flex;
  gap: 10px;
  max-width: 700px;
  margin: 18px auto 0;
  padding: 0 15px;
}

.menu button {
  flex: 1;
  border: none;
  padding: 13px 10px;
  border-radius: 10px;
  background: white;
  color: #087f5b;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.menu button.active {
  background: #087f5b;
  color: white;
}


/* =========================================
   HALAMAN
========================================= */

.page {
  display: none;
  max-width: 700px;
  margin: 15px auto;
  padding: 0 15px 30px;
}

.page.active {
  display: block;
}


/* =========================================
   SCANNER
========================================= */

.camera-card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.camera-title {
  text-align: center;
  font-weight: bold;
  margin-bottom: 12px;
}

.camera-box {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}

#video {
  display: block;
  width: 100%;
}

#canvas {
  display: none;
}

.scan-frame {
  position: absolute;
  width: 60%;
  aspect-ratio: 1 / 1;
  border: 3px solid #00ff88;
  border-radius: 15px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.scan-text {
  text-align: center;
  margin-top: 12px;
  font-size: 14px;
  color: #666;
}


/* =========================================
   HASIL PRESENSI
========================================= */

.result {
  display: none;
  margin-top: 15px;
  background: white;
  border-radius: 15px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.result.success {
  border-top: 5px solid #087f5b;
}

.result.warning {
  border-top: 5px solid #f39c12;
}

.result h2 {
  margin-top: 0;
}

.result-name {
  font-size: 19px;
  font-weight: bold;
  margin: 8px 0;
}

.result-info {
  font-size: 14px;
  line-height: 1.8;
}

.status {
  display: inline-block;
  padding: 7px 15px;
  border-radius: 20px;
  margin-top: 8px;
  font-weight: bold;
}

.status.hadir {
  background: #d8f3dc;
  color: #087f5b;
}

.status.terlambat {
  background: #fff0d6;
  color: #d97706;
}

.next-button {
  margin-top: 15px;
  width: 100%;
  border: none;
  padding: 12px;
  border-radius: 10px;
  background: #087f5b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}


/* =========================================
   REKAP
========================================= */

.rekap-card {
  background: white;
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.rekap-card h2 {
  text-align: center;
  margin-top: 0;
  color: #087f5b;
}


/* FILTER */

.filter {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.filter select,
.filter input {
  flex: 1;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
}

.filter button {
  padding: 11px 16px;
  border: none;
  border-radius: 8px;
  background: #087f5b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}


/* RINGKASAN */

.summary {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin-bottom: 18px;
}

.summary-box {
  background: #f5f5f5;
  border-radius: 9px;
  padding: 9px 5px;
  text-align: center;
}

.summary-box strong {
  display: block;
  font-size: 20px;
}

.summary-box span {
  font-size: 11px;
}


/* TABEL */

.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th,
td {
  padding: 10px 8px;
  border-bottom: 1px solid #eee;
  text-align: center;
  font-size: 13px;
}

th {
  background: #087f5b;
  color: white;
}

td:nth-child(2) {
  text-align: left;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}

.error {
  background: #ffe5e5;
  color: #b91c1c;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  display: none;
}


/* =========================================
   CETAK
========================================= */

.print-button {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: #374151;
  color: white;
  font-weight: bold;
  cursor: pointer;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

  .header h1 {
    font-size: 21px;
  }

  .menu button {
    font-size: 13px;
  }

  .filter {
    flex-wrap: wrap;
  }

  .filter button {
    width: 100%;
  }

  .summary {
    grid-template-columns: repeat(3, 1fr);
  }

}

</style>
</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<div class="header">

  <h1>📋 PRESENSI GURU</h1>

  <p>SMK Karya Bangsa Nusantara</p>

</div>


<!-- ========================================
     MENU
======================================== -->

<div class="menu">

  <button
    id="btnScan"
    class="active"
    onclick="showPage('scan')">

    📷 Scan Presensi

  </button>


  <button
    id="btnRekap"
    onclick="showPage('rekap')">

    📊 Rekap Bulanan

  </button>

</div>


<!-- ========================================
     HALAMAN SCAN
======================================== -->

<div
  id="scanPage"
  class="page active">


  <div class="camera-card">

    <div class="camera-title">
      Arahkan kamera ke QR Code Guru
    </div>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline>
      </video>


      <canvas
        id="canvas">
      </canvas>


      <div class="scan-frame"></div>

    </div>


    <div class="scan-text">
      Pastikan QR Code berada di dalam kotak
    </div>

  </div>


  <!-- HASIL -->

  <div
    id="result"
    class="result">

    <h2 id="resultTitle">
      PRESENSI BERHASIL
    </h2>


    <div
      id="resultName"
      class="result-name">
    </div>


    <div
      id="resultInfo"
      class="result-info">
    </div>


    <div
      id="resultStatus"
      class="status">
    </div>


    <button
      class="next-button"
      onclick="location.reload()">

      🔄 Scan Berikutnya

    </button>

  </div>

</div>


<!-- ========================================
     HALAMAN REKAP
======================================== -->

<div
  id="rekapPage"
  class="page">


  <div class="rekap-card">

    <h2>📊 Rekap Presensi Bulanan</h2>


    <!-- ERROR -->

    <div
      id="rekapError"
      class="error">
    </div>


    <!-- FILTER -->

    <div class="filter">

      <select id="bulan">

        <option value="1">Januari</option>
        <option value="2">Februari</option>
        <option value="3">Maret</option>
        <option value="4">April</option>
        <option value="5">Mei</option>
        <option value="6">Juni</option>
        <option value="7">Juli</option>
        <option value="8">Agustus</option>
        <option value="9">September</option>
        <option value="10">Oktober</option>
        <option value="11">November</option>
        <option value="12">Desember</option>

      </select>


      <input
        type="number"
        id="tahun"
        min="2020"
        max="2100">


      <button onclick="loadRekap()">
        Tampilkan
      </button>

    </div>


    <!-- RINGKASAN -->

    <div
      id="summary"
      class="summary"
      style="display:none;">

      <div class="summary-box">
        <strong id="totalHadir">0</strong>
        <span>Hadir</span>
      </div>

      <div class="summary-box">
        <strong id="totalTerlambat">0</strong>
        <span>Terlambat</span>
      </div>

      <div class="summary-box">
        <strong id="totalIzin">0</strong>
        <span>Izin</span>
      </div>

      <div class="summary-box">
        <strong id="totalSakit">0</strong>
        <span>Sakit</span>
      </div>

      <div class="summary-box">
        <strong id="totalAlpa">0</strong>
        <span>Alpa</span>
      </div>

    </div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
      style="display:none;">

      Memuat data rekap...

    </div>


    <!-- TABEL -->

    <div class="table-wrapper">

      <table id="rekapTable">

        <thead>

          <tr>

            <th>No</th>

            <th>Nama Guru</th>

            <th>Hadir</th>

            <th>Terlambat</th>

            <th>Izin</th>

            <th>Sakit</th>

            <th>Alpa</th>

          </tr>

        </thead>


        <tbody id="rekapBody">

        </tbody>

      </table>

    </div>


    <button
      class="print-button"
      onclick="window.print()">

      🖨️ Cetak Rekap

    </button>

  </div>

</div>


<script>


// ==================================================
// URL APPS SCRIPT
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycby--58s4qJ3QocY3bb7pM_RB9Jm5wb8NDDTBXyEsul733suyFoHjgdOS-XKbbteyAPg/exec";


// ==================================================
// ELEMENT SCANNER
// ==================================================

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const context =
canvas.getContext("2d");


let scanning = true;


// ==================================================
// PINDAH HALAMAN
// ==================================================

function showPage(page) {

  const scanPage =
    document.getElementById("scanPage");

  const rekapPage =
    document.getElementById("rekapPage");

  const btnScan =
    document.getElementById("btnScan");

  const btnRekap =
    document.getElementById("btnRekap");


  if (page === "scan") {

    scanPage.classList.add("active");

    rekapPage.classList.remove("active");

    btnScan.classList.add("active");

    btnRekap.classList.remove("active");

    startCamera();

  }


  if (page === "rekap") {

    scanPage.classList.remove("active");

    rekapPage.classList.add("active");

    btnScan.classList.remove("active");

    btnRekap.classList.add("active");

    stopCamera();

    loadRekap();

  }

}


// ==================================================
// KAMERA
// ==================================================

let stream = null;


async function startCamera() {

  try {

    if (stream) {
      return;
    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });


    video.srcObject = stream;

    video.setAttribute("playsinline", true);

    video.play();

    requestAnimationFrame(scanQR);

  }

  catch (error) {

    console.error(error);

    alert(
      "Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan."
    );

  }

}


// ==================================================
// STOP KAMERA
// ==================================================

function stopCamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(track => track.stop());


  stream = null;

}


// ==================================================
// SCAN QR
// ==================================================

function scanQR() {

  if (!stream || !scanning) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "dontInvert"
        }
      );


    if (code && code.data) {

      scanning = false;

      stopCamera();

      prosesQR(
        code.data.trim()
      );

      return;

    }

  }


  requestAnimationFrame(scanQR);

}


// ==================================================
// PROSES QR
// ==================================================

function prosesQR(idGuru) {

  const result =
    document.getElementById("result");

  const resultTitle =
    document.getElementById("resultTitle");

  const resultName =
    document.getElementById("resultName");

  const resultInfo =
    document.getElementById("resultInfo");

  const resultStatus =
    document.getElementById("resultStatus");


  result.style.display =
    "block";

  result.className =
    "result";


  resultTitle.textContent =
    "MEMPROSES PRESENSI...";


  resultName.textContent =
    "";

  resultInfo.textContent =
    "";

  resultStatus.textContent =
    "";



  const callbackName =
    "callbackPresensi_" +
    Date.now();


  window[callbackName] =
    function(data) {

      delete window[callbackName];


      if (data.sudahPresensi) {

        result.className =
          "result warning";


        resultTitle.textContent =
          "⚠️ SUDAH PRESENSI HARI INI";


        resultName.textContent =
          data.nama;


        resultInfo.innerHTML =
          "ID Guru: " +
          data.id +
          "<br>" +
          "Tanggal: " +
          data.tanggal +
          "<br>" +
          "Jam: " +
          data.jam;


        resultStatus.textContent =
          data.status;


        resultStatus.className =
          "status " +
          (
            data.status === "HADIR"
              ? "hadir"
              : "terlambat"
          );


        return;

      }


      if (!data.sukses) {

        result.className =
          "result warning";


        resultTitle.textContent =
          "❌ PRESENSI GAGAL";


        resultInfo.textContent =
          data.pesan ||
          "Terjadi kesalahan.";


        return;

      }


      result.className =
        "result success";


      resultTitle.textContent =
        "✅ PRESENSI BERHASIL";


      resultName.textContent =
        data.nama;


      resultInfo.innerHTML =
        "ID Guru: " +
        data.id +
        "<br>" +
        "Tanggal: " +
        data.tanggal +
        "<br>" +
        "Jam: " +
        data.jam;


      resultStatus.textContent =
        data.status;


      resultStatus.className =
        "status " +
        (
          data.status === "HADIR"
            ? "hadir"
            : "terlambat"
        );

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?id=" +
    encodeURIComponent(idGuru) +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[callbackName];


      result.className =
        "result warning";


      resultTitle.textContent =
        "❌ KONEKSI GAGAL";


      resultInfo.textContent =
        "Tidak dapat terhubung ke server presensi.";

    };


  document.body.appendChild(script);

}


// ==================================================
// REKAP BULANAN
// ==================================================

function loadRekap() {

  const bulan =
    document.getElementById("bulan").value;

  const tahun =
    document.getElementById("tahun").value;


  const loading =
    document.getElementById("loading");

  const body =
    document.getElementById("rekapBody");

  const error =
    document.getElementById("rekapError");

  const summary =
    document.getElementById("summary");


  error.style.display =
    "none";


  summary.style.display =
    "none";


  loading.style.display =
    "block";


  body.innerHTML =
    "";


  const callbackName =
    "callbackRekap_" +
    Date.now();


  window[callbackName] =
    function(data) {

      delete window[callbackName];


      loading.style.display =
        "none";


      if (!data.sukses) {

        error.textContent =
          data.pesan ||
          "Gagal mengambil data rekap.";

        error.style.display =
          "block";

        return;

      }


      tampilkanRekap(
        data.data
      );

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?bulan=" +
    encodeURIComponent(bulan) +
    "&tahun=" +
    encodeURIComponent(tahun) +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[callbackName];


      loading.style.display =
        "none";


      error.textContent =
        "Tidak dapat terhubung ke server.";

      error.style.display =
        "block";

    };


  document.body.appendChild(script);

}


// ==================================================
// TAMPILKAN REKAP
// ==================================================

function tampilkanRekap(data) {

  const body =
    document.getElementById("rekapBody");


  body.innerHTML =
    "";


  let totalHadir = 0;

  let totalTerlambat = 0;

  let totalIzin = 0;

  let totalSakit = 0;

  let totalAlpa = 0;


  data.forEach(
    function(guru, index) {

      totalHadir +=
        Number(guru.hadir || 0);

      totalTerlambat +=
        Number(guru.terlambat || 0);

      totalIzin +=
        Number(guru.izin || 0);

      totalSakit +=
        Number(guru.sakit || 0);

      totalAlpa +=
        Number(guru.alpa || 0);


      const row =
        document.createElement("tr");


      row.innerHTML =

        "<td>" +
        (index + 1) +
        "</td>" +

        "<td>" +
        escapeHtml(guru.nama) +
        "</td>" +

        "<td>" +
        guru.hadir +
        "</td>" +

        "<td>" +
        guru.terlambat +
        "</td>" +

        "<td>" +
        guru.izin +
        "</td>" +

        "<td>" +
        guru.sakit +
        "</td>" +

        "<td>" +
        guru.alpa +
        "</td>";


      body.appendChild(row);

    }
  );


  document.getElementById("totalHadir")
    .textContent =
    totalHadir;


  document.getElementById("totalTerlambat")
    .textContent =
    totalTerlambat;


  document.getElementById("totalIzin")
    .textContent =
    totalIzin;


  document.getElementById("totalSakit")
    .textContent =
    totalSakit;


  document.getElementById("totalAlpa")
    .textContent =
    totalAlpa;


  document.getElementById("summary")
    .style.display =
    "grid";

}


// ==================================================
// AMANKAN NAMA
// ==================================================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


// ==================================================
// TAHUN DEFAULT
// ==================================================

document.getElementById("tahun")
  .value =
  new Date().getFullYear();


// ==================================================
// BULAN DEFAULT
// ==================================================

document.getElementById("bulan")
  .value =
  new Date().getMonth() + 1;


// ==================================================
// MULAI KAMERA
// ==================================================

startCamera();

</script>


</body>
</html>
