<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Presensi Guru</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #1f2937;
}

.app {
  max-width: 500px;
  margin: auto;
  background: white;
  min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
  background: linear-gradient(135deg, #166534, #15803d);
  color: white;
  text-align: center;
  padding: 25px 20px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  margin: 8px 0 0;
  font-size: 15px;
  opacity: 0.95;
}

/* =========================
   CONTENT
========================= */

.content {
  padding: 20px;
  text-align: center;
}

#status {
  margin: 5px 0 18px;
  padding: 15px;
  border-radius: 12px;
  background: #f1f5f9;
  color: #475569;
  font-size: 15px;
  line-height: 1.5;
}

/* =========================
   CAMERA
========================= */

.camera-box {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: auto;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
}

video {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

.scan-frame {
  position: absolute;
  top: 15%;
  left: 15%;
  width: 70%;
  height: 70%;
  border: 3px solid #22c55e;
  border-radius: 18px;
  pointer-events: none;
}

.scan-text {
  position: absolute;
  bottom: 15px;
  left: 0;
  right: 0;
  color: white;
  font-size: 14px;
  text-shadow: 0 1px 3px #000;
  pointer-events: none;
}

canvas {
  display: none;
}

/* =========================
   HASIL
========================= */

#hasil {
  display: none;
  margin-top: 15px;
  padding: 22px 18px;
  border-radius: 18px;
  background: #f0fdf4;
  border: 2px solid #22c55e;
}

#hasil.sudah {
  background: #fff7ed;
  border-color: #f97316;
}

.icon-hasil {
  font-size: 48px;
  margin-bottom: 5px;
}

#judulHasil {
  margin: 5px 0 15px;
  font-size: 21px;
  color: #166534;
}

#hasil.sudah #judulHasil {
  color: #c2410c;
}

#nama {
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0;
  line-height: 1.3;
}

.data-row {
  display: flex;
  justify-content: space-between;
  text-align: left;
  padding: 9px 0;
  border-bottom: 1px solid #dcfce7;
  font-size: 15px;
}

.data-row:last-of-type {
  border-bottom: none;
}

.data-label {
  color: #64748b;
}

.data-value {
  font-weight: bold;
  text-align: right;
  max-width: 60%;
}

/* =========================
   STATUS PRESENSI
========================= */

.status-presensi {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 25px;
  border-radius: 30px;
  background: #16a34a;
  color: white;
  font-weight: bold;
  font-size: 17px;
}

.status-presensi.terlambat {
  background: #dc2626;
}

.status-presensi.sudah {
  background: #f97316;
}

/* =========================
   BUTTON
========================= */

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 12px;
  background: #166534;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.footer {
  padding: 20px;
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 400px) {

  .header h1 {
    font-size: 24px;
  }

  .content {
    padding: 15px;
  }

  #nama {
    font-size: 20px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <h1>Presensi Guru</h1>

    <p>SMK Karya Bangsa Nusantara</p>

  </div>


  <!-- CONTENT -->

  <div class="content">

    <!-- STATUS -->

    <div id="status">
      Membuka kamera...
    </div>


    <!-- CAMERA -->

    <div
      class="camera-box"
      id="cameraBox">

      <video
        id="video"
        autoplay
        playsinline>
      </video>

      <div class="scan-frame"></div>

      <div class="scan-text">
        Arahkan QR Code ke dalam kotak
      </div>

    </div>


    <canvas id="canvas"></canvas>


    <!-- HASIL -->

    <div id="hasil">

      <div
        class="icon-hasil"
        id="iconHasil">
        ✓
      </div>

      <h2 id="judulHasil">
        PRESENSI BERHASIL
      </h2>


      <div id="nama"></div>


      <div class="data-row">

        <span class="data-label">
          ID Guru
        </span>

        <span
          class="data-value"
          id="idGuru">
        </span>

      </div>


      <div class="data-row">

        <span class="data-label">
          Tanggal
        </span>

        <span
          class="data-value"
          id="tanggal">
        </span>

      </div>


      <div class="data-row">

        <span class="data-label">
          Jam
        </span>

        <span
          class="data-value"
          id="jam">
        </span>

      </div>


      <div
        class="status-presensi"
        id="statusPresensi">
      </div>

    </div>


    <!-- BUTTON -->

    <button
      id="scanLagi"
      onclick="location.reload()"
      style="display:none;">

      📷 SCAN GURU BERIKUTNYA

    </button>

  </div>


  <div class="footer">
    Sistem Presensi Guru
  </div>

</div>


<script>

/* ==================================================
   URL APPS SCRIPT
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby--58s4qJ3QocY3bb7pM_RB9Jm5wb8NDDTBXyEsul733suyFoHjgdOS-XKbbteyAPg/exec";


/* ==================================================
   ELEMENT
================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const hasil =
document.getElementById("hasil");

const cameraBox =
document.getElementById("cameraBox");

const scanLagi =
document.getElementById("scanLagi");


let stream = null;

let scanning = false;


/* ==================================================
   LOAD jsQR
================================================== */

const scriptQR =
document.createElement("script");

scriptQR.src =
"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


scriptQR.onload = function() {

  mulaiKamera();

};


scriptQR.onerror = function() {

  status.innerHTML =
    "❌ Gagal memuat sistem pemindai QR.";

};


document.head.appendChild(scriptQR);


/* ==================================================
   MULAI KAMERA
================================================== */

async function mulaiKamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;

    scanning = true;

    status.innerText =
      "Kamera aktif. Arahkan QR Code guru ke dalam kotak.";

    scanQR();

  }

  catch (error) {

    status.innerHTML =
      "❌ Kamera tidak dapat dibuka.<br><br>" +
      "Pastikan izin kamera sudah diberikan.";

  }

}


/* ==================================================
   SCAN QR
================================================== */

function scanQR() {

  if (!scanning) return;


  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height
      );


    if (code) {

      scanning = false;

      hentikanKamera();

      status.innerText =
        "QR terbaca. Memproses presensi...";

      kirimPresensi(code.data);

      return;

    }

  }


  requestAnimationFrame(scanQR);

}


/* ==================================================
   HENTIKAN KAMERA
================================================== */

function hentikanKamera() {

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;

  }

}


/* ==================================================
   KIRIM PRESENSI
================================================== */

function kirimPresensi(idGuru) {

  const callback =
    "presensi_" + Date.now();


  window[callback] = function(data) {

    if (data.sukses) {

      tampilkanHasil(data);

    }

    else if (data.sudahPresensi) {

      tampilkanSudahPresensi(data);

    }

    else {

      status.innerHTML =
        "❌ " +
        (data.pesan ||
        "Presensi gagal.");

      scanLagi.style.display =
        "block";

    }


    delete window[callback];

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?id=" +
    encodeURIComponent(idGuru) +
    "&callback=" +
    callback +
    "&t=" +
    Date.now();


  script.onerror = function() {

    status.innerHTML =
      "❌ Tidak dapat terhubung ke server presensi.";

    scanLagi.style.display =
      "block";

  };


  document.body.appendChild(script);

}


/* ==================================================
   HASIL PRESENSI BERHASIL
================================================== */

function tampilkanHasil(data) {

  cameraBox.style.display =
    "none";

  status.style.display =
    "none";

  hasil.style.display =
    "block";

  hasil.classList.remove("sudah");


  document.getElementById("iconHasil")
    .innerText = "✓";


  document.getElementById("judulHasil")
    .innerText =
      "PRESENSI BERHASIL";


  document.getElementById("nama")
    .innerText =
      data.nama;


  document.getElementById("idGuru")
    .innerText =
      data.id;


  document.getElementById("tanggal")
    .innerText =
      data.tanggal;


  document.getElementById("jam")
    .innerText =
      data.jam;


  const statusPresensi =
    document.getElementById("statusPresensi");


  statusPresensi.innerText =
    data.status;


  statusPresensi.className =
    "status-presensi";


  if (data.status === "TERLAMBAT") {

    statusPresensi.classList.add(
      "terlambat"
    );

  }


  scanLagi.style.display =
    "block";

}


/* ==================================================
   SUDAH PRESENSI
================================================== */

function tampilkanSudahPresensi(data) {

  cameraBox.style.display =
    "none";

  status.style.display =
    "none";

  hasil.style.display =
    "block";

  hasil.classList.add("sudah");


  document.getElementById("iconHasil")
    .innerText = "⚠️";


  document.getElementById("judulHasil")
    .innerText =
      "SUDAH PRESENSI HARI INI";


  document.getElementById("nama")
    .innerText =
      data.nama;


  document.getElementById("idGuru")
    .innerText =
      data.id;


  document.getElementById("tanggal")
    .innerText =
      data.tanggal;


  document.getElementById("jam")
    .innerText =
      data.jam;


  const statusPresensi =
    document.getElementById("statusPresensi");


  statusPresensi.innerText =
    data.status;


  statusPresensi.className =
    "status-presensi sudah";


  scanLagi.style.display =
    "block";

}

</script>

</body>

</html>
