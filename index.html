<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Kamera</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>TEST KAMERA PRESENSI</h2>

<div id="status">
  Tekan tombol untuk membuka kamera
</div>

<button onclick="bukaKamera()">
  📷 BUKA KAMERA
</button>

<br>

<video id="video" autoplay playsinline></video>

<script>

async function bukaKamera() {

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

    video.srcObject = stream;

    status.innerHTML =
      "✅ KAMERA BERHASIL DIBUKA";

  } catch (error) {

    status.innerHTML =
      "❌ KAMERA GAGAL DIBUKA<br><br>" +
      error.name +
      "<br>" +
      error.message;

  }

}

</script>

</body>
</html>
