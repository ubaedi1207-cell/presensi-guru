<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Presensi Guru</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.app {
  max-width: 500px;
  margin: auto;
  background: white;
  min-height: 100vh;
}

.header {
  background: #166534;
  color: white;
  text-align: center;
  padding: 22px;
}

.header h1 {
  margin: 0;
}

.header p {
  margin: 7px 0 0;
}

.content {
  padding: 20px;
  text-align: center;
}

video {
  width: 100%;
  max-width: 420px;
  border-radius: 15px;
  background: black;
}

canvas {
  display: none;
}

#status {
  margin: 15px 0;
  padding: 15px;
  border-radius: 10px;
  background: #f1f5f9;
}

#hasil {
  display: none;
  padding: 20px;
  border-radius: 15px;
  background: #f0fdf4;
  border: 2px solid #22c55e;
}

#nama {
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0;
}

#idGuru {
  font-size: 18px;
}

.status {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  border-radius: 25px;
  background: #16a34a;
  color: white;
  font-weight: bold;
}

.terlambat {
  background: #dc2626;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: #166534;
  color: white;
  font-size: 16px;
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <h1>Presensi Guru</h1>

    <p>SMK Karya Bangsa Nusantara</p>

  </div>


  <div class="content">

    <div id="status">
      Membuka kamera...
    </div>


    <video id="video"
           autoplay
           playsinline></video>


    <canvas id="canvas"></canvas>


    <div id="hasil">

      <h2>✓ PRESENSI BERHASIL</h2>

      <div id="nama"></div>

      <div>
        ID Guru:
        <span id="idGuru"></span>
      </div>

      <div>
        Tanggal:
        <span id="tanggal"></span>
      </div>

      <div>
        Jam:
        <span id="jam"></span>
      </div>

      <div
        class="status"
        id="statusPresensi">
      </div>

    </div>


    <button
      id="scanLagi"
      onclick="location.reload()"
      style="display:none;">

      SCAN GURU BERIKUTNYA

    </button>

  </div>

</div>


<script>


/* =========================
   URL APPS SCRIPT
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycby--58s4qJ3QocY3bb7pM_RB9Jm5wb8NDDTBXyEsul733suyFoHjgdOS-XKbbteyAPg/exec";


/* =========================
   ELEMENT
========================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");


let stream = null;

let scanning = false;


/* =========================
   LOAD jsQR
========================= */

const scriptQR =
document.createElement("script");

scriptQR.src =
"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


scriptQR.onload = function() {

  mulaiKamera();

};


document.head.appendChild(scriptQR);


/* =========================
   MULAI KAMERA
========================= */

async function mulaiKamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;

    scanning = true;

    status.innerText =
      "Kamera aktif. Arahkan ke QR Code guru.";

    scanQR();

  }

  catch (error) {

    status.innerHTML =
      "❌ Kamera tidak dapat dibuka.<br><br>" +
      error.name +
      "<br>" +
      error.message;

  }

}


/* =========================
   SCAN QR
========================= */

function scanQR() {

  if (!scanning) return;


  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height
      );


    if (code) {

      scanning = false;

      hentikanKamera();

      status.innerText =
        "QR terbaca. Menyimpan presensi...";

      kirimPresensi(code.data);

      return;

    }

  }


  requestAnimationFrame(scanQR);

}


/* =========================
   HENTIKAN KAMERA
========================= */

function hentikanKamera() {

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

  }

}


/* =========================
   KIRIM PRESENSI
========================= */

function kirimPresensi(idGuru) {

  const callback =
    "presensi_" + Date.now();


  window[callback] = function(data) {

    if (data.sukses) {

      tampilkanHasil(data);

    }

    else {

      status.innerHTML =
        "❌ " + data.pesan;

      document.getElementById("scanLagi")
        .style.display = "block";

    }


    delete window[callback];

    if (script.parentNode) {

      script.parentNode.removeChild(script);

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?id=" +
    encodeURIComponent(idGuru) +
    "&callback=" +
    callback;


  script.onerror = function() {

    status.innerHTML =
      "❌ Tidak dapat terhubung ke server presensi.";

    document.getElementById("scanLagi")
      .style.display = "block";

  };


  document.body.appendChild(script);

}


/* =========================
   HASIL PRESENSI
========================= */

function tampilkanHasil(data) {

  document.getElementById("video")
    .style.display = "none";


  status.style.display =
    "none";


  document.getElementById("hasil")
    .style.display = "block";


  document.getElementById("nama")
    .innerText = data.nama;


  document.getElementById("idGuru")
    .innerText = data.id;


  document.getElementById("tanggal")
    .innerText = data.tanggal;


  document.getElementById("jam")
    .innerText = data.jam;


  const statusPresensi =
    document.getElementById("statusPresensi");


  statusPresensi.innerText =
    data.status;


  if (data.status === "TERLAMBAT") {

    statusPresensi.classList.add(
      "terlambat"
    );

  }


  document.getElementById("scanLagi")
    .style.display = "block";

}

</script>

</body>

</html>
